<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sign Up</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <nav class="navbar">

        <div class="nav-title">
            Annsborough Park Pickleball Tournament
        </div>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="login.html">
                Log In
            </a>

        </div>

    </nav>


    <main class="container auth-container">

        <div class="card">

            <h1>
                Create Account
            </h1>


            <form id="signup-form">

                <label for="firstName">
                    First Name
                </label>

                <input
                    type="text"
                    id="firstName"
                    placeholder="Enter your firstName"
                    maxlength="30"
                    required
                >


                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    minlength="6"
                    required
                >


                <button type="submit">
                    Sign Up
                </button>

            </form>


            <div
                id="signup-message"
                class="message"
            ></div>


            <p class="auth-link">

                Already have an account?

                <a href="login.html">
                    Log In
                </a>

            </p>

        </div>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/supabase.js"></script>

    <script src="js/signup.js"></script>

</body>

</html>
