<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Challenges</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="nav-title">
            Annsborough Park PB Tourny
        </div>


        <div class="nav-links">

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="challenges.html">
                Challenges
            </a>

            <a href="leaderboard.html">
                Leaderboard
            </a>

            <button
                id="logout-button"
                class="nav-button"
            >
                Logout
            </button>

        </div>

    </nav>



    <!-- MAIN CONTENT -->

    <main class="container">


        <h1 class="page-title">
            Challenges
        </h1>



        <!-- =================================================
             CHALLENGE A TEAM
             ================================================= -->

        <section class="card challenge-section">

            <h2>
                Challenge a Team
            </h2>

            <p class="section-description">
                Choose another team, a date, and a time.
            </p>


            <form id="challenge-form">


                <label for="team-select">
                    Team You Want to Challenge
                </label>

                <select
                    id="team-select"
                    required
                >

                    <option value="">
                        Loading teams...
                    </option>

                </select>



                <label for="match-date">
                    Date
                </label>

                <input
                    type="date"
                    id="match-date"
                    required
                >



                <label for="match-time">
                    Time
                </label>

                <select
                    id="match-time"
                    required
                >

                    <option value="">
                        Select a time
                    </option>

                </select>



                <button type="submit">
                    Send Challenge
                </button>


                <div
                    id="challenge-message"
                    class="message"
                ></div>


            </form>

        </section>



        <!-- =================================================
             INCOMING CHALLENGES
             ================================================= -->

        <section class="card challenge-section">

            <h2>
                Incoming Challenges
            </h2>


            <div id="incoming-challenges">

                <p class="loading-text">
                    Loading challenges...
                </p>

            </div>

        </section>



        <!-- =================================================
             YOUR MATCHES
             ================================================= -->

        <section class="card challenge-section">

            <h2>
                Your Matches
            </h2>


            <p class="section-description">
                All matches your team is currently signed up for.
            </p>


            <div id="your-matches">

                <p class="loading-text">
                    Loading matches...
                </p>

            </div>

        </section>


    </main>



    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/supabase.js"></script>

    <script src="js/challenges.js"></script>


</body>

</html>
