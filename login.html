<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Log In</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <nav class="navbar">

        <div class="nav-title">
            Annsborough Park Pickleball Tournament
        </div>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="signup.html">
                Sign Up
            </a>

        </div>

    </nav>


    <main class="container auth-container">

        <div class="card">

            <h1>Log In</h1>

            <form id="login-form">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >


                <button type="submit">
                    Log In
                </button>

            </form>


            <div
                id="login-message"
                class="message"
            ></div>


            <p class="auth-link">

                Don't have an account?

                <a href="signup.html">
                    Sign Up
                </a>

            </p>

        </div>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/supabase.js"></script>

    <script src="js/login.js"></script>

</body>

</html>
